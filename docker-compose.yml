# Asameet self-hosted stack. The database is managed Postgres (Supabase),
# so the web container is the whole stack — see docs/DEPLOYMENT.md.
services:
  web:
    build:
      context: .
      args:
        # Baked into the bundle at build time (NEXT_PUBLIC_*), so it is a build arg.
        NEXT_PUBLIC_APP_URL: ${APP_URL:-https://asameet.online}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
